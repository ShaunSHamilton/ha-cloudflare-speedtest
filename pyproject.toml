[project]
name = "ha-cloudflare-speedtest-dev"
version = "0.0.0"
requires-python = ">=3.14.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "SIM", "UP"]
ignore = ["COM812"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[dependency-groups]
dev = [
  "home-assistant-frontend>=20260826.0",
  "pytest-homeassistant-custom-component==0.13.357",
  "ruff==0.16.4",
]
